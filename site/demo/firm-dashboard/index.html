<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Meet Lou Firm Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="robots" content="noindex, nofollow">
</head><body>
<style>
  /* Layout: firm dashboard. Sidebar = real navigation for the signed-in role, with a demo person switch at the foot;
     top bar = search for any matter; a matter opens as its own page with a back button. Bottom tab bar on phones.
     Chart marks use the validated categorical palette; brand accent is reserved for controls. */
  :root{
    --page:#F6F3ED; --card:#FFFDF8; --panel:#F0EBE3; --ink:#1A1A18; --ink2:#4E4A43;
    --muted:#7A746A; --rule:#E4DED4; --accent:#C4562A; --accent-ink:#FFFDF8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s1-track:#cde2fb; --deemph:#d3d0c7;
    --grid:#ebe7df; --axis:#c3c2b7;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-text:#006300;
    --scrim:rgba(26,26,24,.28);
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#121110; --card:#1C1A17; --panel:#24221E; --ink:#F4F1EA; --ink2:#C9C3B7;
      --muted:#918A7D; --rule:#302D28; --accent:#E0714A; --accent-ink:#121110;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s1-track:#0d366b; --deemph:#45423c;
      --grid:#2a2824; --axis:#3b3934; --good-text:#0ca30c; --scrim:rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --page:#121110; --card:#1C1A17; --panel:#24221E; --ink:#F4F1EA; --ink2:#C9C3B7;
    --muted:#918A7D; --rule:#302D28; --accent:#E0714A; --accent-ink:#121110;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s1-track:#0d366b; --deemph:#45423c;
    --grid:#2a2824; --axis:#3b3934; --good-text:#0ca30c; --scrim:rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .num{font-variant-numeric:tabular-nums}

  .demobar{background:var(--ink);color:var(--page);font-family:var(--mono);font-size:9.5px;
    letter-spacing:.16em;text-transform:uppercase;text-align:center;padding:6px 12px}

  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 26px)}
  aside{border-right:1px solid var(--rule);background:var(--panel);padding:20px 14px;
    display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:calc(100vh - 26px);
    overflow-y:auto}
  .brand{font-family:var(--serif);font-size:28px;line-height:1;padding:2px 10px 4px}
  .firm{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);padding:0 10px 18px}
  .who{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;
    padding:9px 10px;border-radius:10px;width:100%}
  .who:hover{background:color-mix(in srgb,var(--card) 60%,transparent)}
  .who[aria-pressed="true"]{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
  .av{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px}
  .who b{display:block;font-weight:500;font-size:13.5px}
  .who span span{display:block;font-size:12px;color:var(--muted)}
  .asidefoot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--rule);font-size:12px;
    color:var(--muted);line-height:1.5}

  main{padding:26px clamp(16px,3vw,36px) 60px;min-width:0}
  .top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.6vw,40px);line-height:1.05;
    letter-spacing:-.015em;margin:4px 0 0}
  .eyebrow{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .sub{color:var(--ink2);margin:6px 0 0;font-size:14px}
  h2{font-size:15px;font-weight:600;letter-spacing:-.005em;margin:0}
  .h2row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .h2row .note{font-size:12px;color:var(--muted)}
  section.block{margin-top:26px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 20px;
    min-width:0}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:1180px){.g2,.g2e{grid-template-columns:1fr}}
  @media (max-width:900px){.g3{grid-template-columns:1fr}}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:22px}
  .tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 15px 15px}
  .tile .lbl{font-size:12.5px;color:var(--ink2)}
  .tile .val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
  .tile .ctx{font-size:12px;color:var(--muted);margin-top:4px}

  /* status chip: icon + label, never colour alone */
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);
    white-space:nowrap}
  .st svg{width:14px;height:14px;flex:0 0 auto}
  .st.muted{color:var(--muted)}

  /* lists */
  .q{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:start;
    padding:13px 0;border-top:1px solid var(--rule)}
  .q:first-child{border-top:0;padding-top:2px}
  .q svg.ic{width:16px;height:16px;margin-top:2px}
  .q h3{font-size:14px;font-weight:600;margin:0;line-height:1.35}
  .q p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
  .q .ref{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted)}
  .q.done h3{color:var(--muted);text-decoration:line-through}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .btn{font-size:12.5px;font-weight:500;border:1px solid var(--rule);border-radius:999px;
    padding:5px 12px;white-space:nowrap;background:var(--card)}
  .btn:hover{border-color:var(--ink2)}
  .btn.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
  .btn.pri:hover{opacity:.88}
  .okmsg{font-size:12px;color:var(--good-text);white-space:nowrap;display:inline-flex;gap:5px;
    align-items:center}

  .pgroup + .pgroup{margin-top:16px}
  .pgroup .eyebrow{margin-bottom:6px}
  .prom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;
    border-top:1px solid var(--rule);align-items:baseline}
  .prom:first-of-type{border-top:0}
  .prom b{font-weight:500;font-size:13.5px}
  .prom span.m{display:block;font-size:12px;color:var(--muted)}
  .prom .due{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right}

  /* tables */
  .tbl{overflow-x:auto;margin:0 -2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);
    white-space:nowrap}
  td{padding:10px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:color-mix(in srgb,var(--panel) 70%,transparent)}
  tbody tr.sel td{background:color-mix(in srgb,var(--s1) 8%,transparent)}
  .addr{font-weight:500}
  .small{font-size:12px;color:var(--muted)}
  .pips{display:inline-flex;gap:3px;vertical-align:middle;margin-right:7px}
  .pips i{width:14px;height:4px;border-radius:2px;background:var(--rule);display:block}
  .pips i.on{background:var(--ink2)}

  /* filters */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:30px;padding:12px 0;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--card)}
  .seg button{padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
  select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--rule);
    border-radius:999px;padding:6px 12px}
  .filters .scope{font-size:12px;color:var(--muted);margin-left:auto}

  /* hero */
  .hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:16px;margin-top:18px}
  @media (max-width:1100px){.hero{grid-template-columns:1fr}}
  .herocard .big{font-size:56px;font-weight:600;letter-spacing:-.035em;line-height:1;margin-top:10px}
  .delta{font-size:13px;color:var(--good-text);margin-top:8px;font-weight:500}
  .delta.bad{color:var(--ink2)}
  .meter{position:relative;height:8px;border-radius:4px;background:var(--s1-track);margin-top:18px}
  .meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s1);display:block}
  .meter b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
  .meterlbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}
  .herocard p.gap{margin:16px 0 0;font-size:13px;color:var(--ink2);line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media (max-width:700px){.kpis{grid-template-columns:1fr}}
  .kpi .val{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
  .kpi .base{font-size:12px;color:var(--muted);margin-top:3px}
  .spark{display:block;width:100%;height:40px;margin-top:10px;overflow:visible}

  /* charts */
  .chartcard figure{margin:0}
  .charthead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .charthead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .viewbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink2);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:2px;display:block}
  .plot{margin-top:10px;position:relative}
  .plot svg{display:block;width:100%;overflow:visible}
  .plot text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
  .plot text.v{fill:var(--ink);font-weight:500;font-size:12px}
  .plot text.n{fill:var(--ink2);font-size:12.5px}
  .hit{fill:transparent;cursor:default}
  .hit:focus{outline:none}
  .hit:focus-visible{stroke:var(--accent);stroke-width:2}

  #tip{position:fixed;z-index:60;pointer-events:none;background:var(--card);border:1px solid var(--rule);
    border-radius:10px;padding:9px 11px;box-shadow:0 6px 24px rgba(20,16,10,.14);font-size:12px;
    min-width:150px;max-width:260px}
  #tip .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  #tip .row{display:grid;grid-template-columns:12px auto 1fr;gap:7px;align-items:center;margin-top:5px}
  #tip .row i{height:2px;border-radius:1px;display:block}
  #tip .row b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  #tip .row span{color:var(--ink2)}

  .bars{display:grid;gap:9px;margin-top:6px}
  .barrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:10px;align-items:center;
    font-size:12.5px;color:var(--ink2)}
  .barrow .track{height:8px;border-radius:4px;background:var(--grid);position:relative}
  .barrow .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1);display:block}
  .barrow b{font-weight:500;color:var(--ink);text-align:right}

  .kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:13px;margin-top:10px}
  .kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right;font-weight:500}
  .hold{border:1px solid var(--rule);border-radius:10px;padding:12px 13px;margin-top:12px;background:var(--panel)}
  .hold h3{font-size:13.5px;font-weight:600;margin:4px 0 0}
  .hold p{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}

  /* setup */
  .quote{margin:12px 0 0;padding:13px 15px;border-left:2px solid var(--accent);background:var(--panel);
    border-radius:0 8px 8px 0;font-size:14px;line-height:1.55}
  .lines{display:grid;gap:9px;margin-top:10px}
  .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;font-size:13px;padding-bottom:9px;
    border-bottom:1px solid var(--rule);align-items:baseline}
  .line:last-child{border-bottom:0;padding-bottom:0}
  .line span.m{display:block;font-size:12px;color:var(--muted)}
  .pending{margin-top:10px;font-size:12.5px;color:var(--ink2);background:var(--panel);border-radius:8px;
    padding:9px 11px}
  .slot{color:var(--accent)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--card);z-index:50;
    border-left:1px solid var(--rule);display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(20,16,10,.12)}
  .dhead{padding:16px 20px 14px;border-bottom:1px solid var(--rule);
    padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .dhead .back{display:inline-flex;align-items:center;gap:8px;min-height:40px;margin:-6px 0 6px -4px;padding:6px 12px 6px 6px;
    border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink)}
  .dhead .back span{font-size:16px;line-height:1;color:var(--accent)}
  .dhead .back:hover{background:var(--panel)}
  .dhead .eyebrow{display:block}
  .dhead h2{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.1;margin:6px 0 0;
    letter-spacing:-.01em}
  .dbody{flex:1;overflow-y:auto;padding:16px 20px 30px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
  .stepper div{font-size:10.5px;color:var(--muted);padding-top:9px;position:relative}
  .stepper div::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:2px;background:var(--rule)}
  .stepper div.on::before{background:var(--ink2)}
  .stepper div.cur{color:var(--ink);font-weight:500}
  .stepper div.cur::before{background:var(--accent)}
  .dsec{margin-top:22px}
  .ev{padding:10px 0;border-top:1px solid var(--rule)}
  .ev:first-of-type{border-top:0}
  .ev .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .ev h4{font-size:13.5px;font-weight:600;margin:4px 0 0}
  .ev .vis{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:5px;font-size:12px;color:var(--ink2)}
  .dactions{display:grid;gap:8px;margin-top:22px}
  .wide{display:block;width:100%;text-align:center;padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:500;
    border:1px solid var(--rule)}
  .wide.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
  .wide.link{color:var(--accent);border-color:var(--accent);text-decoration:none}
  .result{font-size:12.5px;color:var(--ink2);background:var(--panel);border-radius:10px;padding:10px 12px}
  .result b{color:var(--ink);font-weight:600}

  /* today across your matters */
  .tgroup{border-top:1px solid var(--rule);padding-top:12px;margin-top:12px}
  .tghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 8px 2px 8px}
  .tghead .small{color:var(--muted)}
  .titem{display:grid;grid-template-columns:44px 20px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;
    padding:9px 8px;border-radius:10px;text-align:left}
  .titem:hover{background:var(--panel)}
  .titem .tt{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
  .titem .tg{padding-top:1px}
  .titem .tk{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .titem .th{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;margin-top:2px}
  .titem.unread .th{font-weight:600}
  .udot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto}
  .titem .tm{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
  .titem .ts{padding-top:2px}
  @media (max-width:640px){.titem{grid-template-columns:40px 18px minmax(0,1fr)}.titem .ts{grid-column:3}}

  /* ===== app shell: real navigation, search, and a matter page instead of a drawer ===== */
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 26px)}
  aside.nav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;
    padding:18px 12px 16px;background:var(--panel);border-right:1px solid var(--rule)}
  aside.nav .brand{padding:2px 12px 2px}
  aside.nav .firm{padding:4px 12px 18px}
  .navlink{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border-radius:9px;
    font-size:14.5px;font-weight:500;color:var(--ink2);text-decoration:none}
  .navlink:hover{background:color-mix(in srgb,var(--card) 65%,transparent);color:var(--ink)}
  .navlink[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  .navlink .ext{color:var(--muted);font-size:13px}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
    font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .viewas{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--rule)}
  .viewas select{width:100%;margin-top:7px}
  .viewas .small{margin:8px 0 0}
  .mainwrap{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:10px clamp(16px,3vw,36px);
    background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
  .mbrand,.mrole{display:none}
  .search{position:relative;flex:1 1 auto;max-width:560px}

  function series(key){

  var SPARKS = {};
  function kpi(label, value, delta, base, data, baseline, unit){

    return '<div class="card kpi"><div class="lbl" style="font-size:13px;color:var(--ink2)">' + esc(label) + '</div>' +
      '<div class="val">' + esc(value) + '</div><div class="delta">' + esc(delta) + '</div><div class="base">' + esc(base) + '</div>' +
      '<svg class="spark" data-spark="' + id + '" role="img" aria-label="' + esc(label) + ' each week"></svg></div>';

  function drawSpark(svg){
    var cfg = SPARKS[svg.getAttribute("data-spark")]; if (!cfg) return;
    var w = svg.clientWidth || 200, h = 40, pad = 5;
    var vals = cfg.data.map(function(p){ return p.v; });
    if (cfg.baseline != null) vals = vals.concat([cfg.baseline]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals); if (hi === lo){ hi += 1; lo -= 1; }
    var n = cfg.data.length;
    var X = function(i){ return n === 1 ? w/2 : pad + i*(w - pad*2)/(n-1); };
    var Y = function(v){ return pad + (hi - v)/(hi - lo)*(h - pad*2); };
    var path = cfg.data.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
    var s = '';
    if (cfg.baseline != null) s += '<line x1="0" x2="' + w + '" y1="' + Y(cfg.baseline).toFixed(1) + '" y2="' + Y(cfg.baseline).toFixed(1) + '" stroke="var(--axis)" stroke-width="1"/>' +
      '<text x="' + w + '" y="' + (Y(cfg.baseline) - 4).toFixed(1) + '" text-anchor="end" style="font-size:10px;fill:var(--muted)">baseline</text>';
    s += '<path d="' + path + '" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    var last = cfg.data[n-1];
    s += '<circle cx="' + X(n-1).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>';
    s += '<line class="xh" x1="0" x2="0" y1="0" y2="' + h + '" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>';
    s += '<rect class="hit" x="0" y="0" width="' + w + '" height="' + h + '" tabindex="0" aria-label="Show weekly values"/>';
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.innerHTML = s;
    var hit = svg.querySelector(".hit"), xh = svg.querySelector(".xh");
    function at(i){
      var p = cfg.data[i]; xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("visibility","visible");
      var r = svg.getBoundingClientRect();
      showTip(r.left + X(i)*(r.width/w), r.top, "Week of " + dLabel(p.d),
        [{ value:(cfg.unit === "/ week" ? Math.round(p.v) : p.v.toFixed(1)) + (cfg.unit === "/ week" ? "" : cfg.unit), label:cfg.label, color:"var(--s1)" }]);
    }
    hit.addEventListener("pointermove", function(e){
      var r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * (w / r.width);
      var i = Math.round((x - pad) / ((w - pad*2) / Math.max(1, n-1))); at(Math.max(0, Math.min(n-1, i)));
    });
    hit.addEventListener("pointerleave", function(){ xh.setAttribute("visibility","hidden"); hideTip(); });
    hit.addEventListener("focus", function(){ at(n-1); });
    hit.addEventListener("blur", function(){ xh.setAttribute("visibility","hidden"); hideTip(); });
  }

  function drawCapture(){

    var svg = host.querySelector("svg"), w = host.clientWidth || 480;

    var max = Math.max.apply(null, data.map(function(d){ return d.total; }));
    var step = max > 1200 ? 500 : max > 600 ? 250 : max > 300 ? 100 : 50;
    var ymax = Math.ceil(max / step) * step;
    var Y = function(v){ return top + ph - v/ymax*ph; };
    var band = pw / data.length, bw = Math.min(24, band*0.62);
    var s = '';
    for (var v = 0; v <= ymax; v += step){
      s += '<line x1="' + left + '" x2="' + (w - right) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (v === 0 ? "var(--axis)" : "var(--grid)") + '" stroke-width="1"/>' +
           '<text x="' + (left - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" class="num">' + fmt(v) + '</text>';
    }
    var every = data.length <= 4 ? 1 : data.length <= 12 ? 2 : 4;
    data.forEach(function(d, i){
      var cx = left + band*i + band/2, x = cx - bw/2, base = Y(0), gap = 2;
      var segs = CAP.map(function(c){ return { v:d[c[0]], c:c }; });

      segs.forEach(function(sg, k){
        var hgt = sg.v/ymax*ph, yTop = y - hgt, isTop = k === segs.length - 1;

               'Q' + (x + bw) + ' ' + y1 + ' ' + (x + bw) + ' ' + (y1 + r) + 'V' + y2 + 'Z" fill="' + sg.c[2] + '"/>';
        } else {
          s += '<rect class="col c' + i + '" x="' + x + '" y="' + y1 + '" width="' + bw + '" height="' + (y2 - y1) + '" fill="' + sg.c[2] + '"/>';
        }
        y = yTop;
      });
      if (i % every === (data.length - 1) % every)

      ["Note · 4 days ago","Seller can complete from mid-September","Client and agent can see","From Priya Nandra, Hamilton & Reeve"]
    ];
    if (m.ref === "MTR-0988") return [
      ["Legal hold · 28 Aug","Matter placed on legal hold","Firm only","Retention paused · Helen Barker"],
      ["Email · 28 Aug","Complaint received from the clients","Firm only","Acknowledged within 24 hours"],
      ["Completion · 14 Aug","Completed","Client can see","Read by both clients"],
      ["Call · 2 Aug","Completion date and funds explained","Client can see","Approved summary read · 2 Aug 16:12"]
    ];
    var base = [
      [["Email · 6 weeks ago","Client care pack sent","Client can see","Read by the client"],["Update · 5 weeks ago","ID and source of funds checked","Firm only",""]],
      [["Update · 3 weeks ago","Searches ordered","Client and agent can see","Read by the client"],["Document · 9 days ago","Local authority search returned clear","Client can see","Read by the client"]],
      [["Call · 4 days ago","Enquiries raised with the other side","Client can see","Approved summary read"],["Email · 2 days ago","Replies to enquiries received","Client can see",""]],
      [["Document · 3 days ago","Contract signed and returned","Client can see","Read by the client"],["Update · yesterday","Deposit received","Client can see",""]],
      [["Update · 6 days ago","Contracts exchanged","Client and agent can see","Read by the client"],["Email · 2 days ago","Completion statement sent","Client can see","Read by the client"]]
    ];
    var out = [];
    for (var i = Math.max(0, m.stage - 1); i <= m.stage; i++) out = base[i].concat(out);
    return out;
  }
  /* ---------------- matter page ---------------- */
  var FROM_LABEL = { today:"Today", matters:"Matters", promises:"Promises", supervision:"Supervision", setup:"Setup" };
  function slugFor(m){
    if (m.ref === "MTR-1001") return "14meadowroad-k7x9";
    var base = shortAddr(m).toLowerCase().replace(/[^a-z0-9]+/g, "");
    var n = +m.ref.slice(4), abc = "abcdefghjkmnpqrstuvwxyz23456789";
    return base + "-" + abc[n % 31] + abc[(n * 7) % 31] + (n % 9 + 1) + abc[(n * 13) % 31];
  }
  function matterEvents(m){
    if (m.ref === "MTR-1001" || m.ref === "MTR-0988") return timelineFor(m);
    var today = TODAY.filter(function(i){ return i.ref === m.ref; }).map(function(i){
      var kind = i.kind === "doc" ? "Document" : i.kind === "call" ? "Call" : "Email";
      var vis = i.dir === "out" && i.kind === "email" ? "Firm only" : /agent/i.test(i.who + i.title) ? "Firm only" : "Client can see";
      return [kind + " · today " + i.t, newDesc(i), vis, i.meta];
    });
    return today.concat(timelineFor(m));
  }
  function matterPromises(ref){
    var out = [];
    [["You owe","you"],["Owed to you","toYou"],["Client owes you","clients"]].forEach(function(g){
      PROMISES[g[1]].forEach(function(p){ if (refOf(p) === ref) out.push([g[0], p]); }); });
    return out;
  }
  function matterPage(){
    var m = byRef[S.matter]; if (!m) return "";
    var fe = FEE.filter(function(f){ return f.id === m.fe; })[0];
    var held = S.holds.indexOf(m.ref) >= 0;
    var h = '<button class="back" data-back="1"><span aria-hidden="true">←</span> Back to ' + (FROM_LABEL[S.from] || "Today") + '</button>';
    h += '<span class="eyebrow" style="margin-top:8px">' + m.ref + ' · ' + esc(m.type) + '</span>' +
      '<h1>' + esc(m.addr) + '</h1><p class="sub">' + esc(m.client) + ' · ' + fe.name + '</p>';
    h += '<div class="stepper" style="margin-top:18px;max-width:640px">' + STAGES.map(function(s, i){
      return '<div class="' + (i < m.stage ? "on" : i === m.stage ? "cur" : "") + '">' + s + '</div>'; }).join("") + '</div>';
    h += '<div class="mpage"><div class="grid" style="align-content:start">';
    if (m.flag === "risk" || m.flag === "overdue" || held)
      h += '<div class="card alertcard">' + (held ? chip("info", "On legal hold · retention paused") + '<p>Nothing on this matter can be deleted until the hold is lifted.</p>' :
        chip(m.flag === "risk" ? "serious" : "warn", m.flag === "risk" ? "Risk flag" : "Overdue promise") + '<p>' + esc(m.why) + '</p>') + '</div>';
    h += '<section class="card"><div class="h2row"><h2>Shared timeline</h2><span class="note">Newest first</span></div>' +
      matterEvents(m).map(function(e){
        var vis = e[2] === "Firm only" ? chip("info", "Firm only") : chip("good", e[2]);
        return '<div class="ev"><div class="meta">' + esc(e[0]) + '</div><h4>' + esc(e[1]) + '</h4><div class="vis">' + vis + (e[3] ? '<span>' + esc(e[3]) + '</span>' : '') + '</div></div>';
      }).join("") + '</section></div>';
    // right rail
    var proms = matterPromises(m.ref);
    h += '<div class="rail">';
    h += '<section class="card"><div class="h2row"><h2>Next</h2></div><p style="margin:0">' + esc(m.next) + '</p></section>';
    h += '<section class="card"><div class="h2row"><h2>Promises on this matter</h2></div>' + (proms.length ? proms.map(function(x){
        return '<div class="prom"><div><b>' + esc(x[1][0]) + '</b><span class="m">' + x[0] + ' · ' + esc(x[1][2]) + '</span></div></div>'; }).join("")
      : '<p class="small" style="margin:0">Nothing outstanding.</p>') + '</section>';
    h += '<section class="card"><div class="h2row"><h2>Contact details</h2></div><p class="small" style="margin:0 0 8px">What the client calls and writes to. Everything sent here lands on this timeline and in ' + fe.short + '\'s inbox.</p>' +
      '<div class="mono-line">0161 496 04' + ("0" + (+m.ref.slice(4) % 100)).slice(-2) + '</div><div class="mono-line">' + slugFor(m) + '@matters.meetlou.app</div></section>';
    h += '<section class="card"><div class="h2row"><h2>Actions</h2></div><div class="dactions" style="margin-top:0">';
    h += S.bundles[m.ref] ? '<div class="result"><b>Bundle prepared</b> · recordings, transcripts, approved summaries, email, documents, read receipts and the consent log, in date order.</div>'
                          : '<button class="wide pri" data-bundle="' + m.ref + '">Export evidence bundle</button>';
    if (S.role === "colp"){
      if (held) h += '<div class="result"><b>On legal hold.</b> Lifting it is recorded in the audit log.</div>';
      else if (S.holdConfirm === m.ref) h += '<div class="result">This pauses retention for every record on the matter.<div style="display:flex;gap:8px;margin-top:10px"><button class="btn pri" data-hold-yes="' + m.ref + '">Place hold</button><button class="btn" data-hold-no="1">Cancel</button></div></div>';
      else h += '<button class="wide" data-hold="' + m.ref + '">Place on legal hold</button>';
    } else if (!held){
      h += S.holdAsked[m.ref] ? '<div class="result"><b>Asked.</b> Helen Barker will see the request in Supervision.</div>'
                              : '<button class="wide" data-hold-ask="' + m.ref + '">Ask the compliance officer for a legal hold</button>';
    }
    if (m.ref === "MTR-1001") h += '<a class="wide link" href="' + CLIENT_APP + '" target="_blank" rel="noopener">See Sarah\'s view of this matter ↗</a>';
    h += '</div></section></div></div>';
    return h;
  }

  /* ============================================================
     NAVIGATION AND SEARCH
     ============================================================ */
  var COMPLAINT_URL = "/demo/complaint-workspace/";
  var ACCESS_URL = "/demo/staff-access-log/";
  var HOME = { fee:"today", colp:"supervision", pm:"setup" };
  function navItems(){
    if (S.role === "fee") return [["today","Today", openTodo().length], ["matters","Matters", 0], ["promises","Promises", overdueCount()]];
    if (S.role === "colp") return [["supervision","Supervision", 0], ["link:" + COMPLAINT_URL, "Complaints", 0], ["link:" + ACCESS_URL, "Lou staff access", 0]];
    return [["setup","Setup", 0]];
  }
  function renderNav(){
    var cur = S.page === "matter" ? S.from : S.page;
    var html = navItems().map(function(n){
      var badge = n[2] ? '<span class="badge" aria-label="' + n[2] + ' waiting">' + n[2] + '</span>' : '';
      if (n[0].indexOf("link:") === 0) return '<a class="navlink" href="' + n[0].slice(5) + '" target="_blank" rel="noopener">' + n[1] + '<span class="ext" aria-hidden="true">↗</span></a>';
      return '<button class="navlink" data-go="' + n[0] + '"' + (cur === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + badge + '</button>';
    }).join("");
    $("navList").innerHTML = html;
    $("tabbar").innerHTML = html;
    $("tabbar").hidden = navItems().length < 2;
    var who = { fee:"Daniel Hughes · fee earner", colp:"Helen Barker · compliance officer & partner", pm:"James Whitaker · practice manager" }[S.role];
    $("whoLine").textContent = who;
    $("roleSel").value = S.role; $("roleSelM").value = S.role;
    $("searchBox").hidden = S.role === "pm";
  }
  function searchPool(){ return S.role === "fee" ? myMatters() : MATTERS; }
  function runSearch(q){
    var box = $("qres"); q = q.toLowerCase().trim();
    if (!q){ box.hidden = true; box.innerHTML = ""; return []; }
    var hits = searchPool().filter(function(m){ return (m.addr + " " + m.client + " " + m.ref).toLowerCase().indexOf(q) >= 0; }).slice(0, 6);
    box.innerHTML = hits.length ? hits.map(function(m, i){
      return '<button data-sref="' + m.ref + '"' + (i === 0 ? ' class="on"' : '') + '><b>' + esc(shortAddr(m)) + '</b><span>' + esc(m.client) + ' · ' + m.ref + ' · ' + STAGES[m.stage] + '</span></button>'; }).join("")
      : '<p class="small" style="margin:8px 10px">No matter matches “' + esc(q) + '”.</p>';
    box.hidden = false;
    return hits;
  }
  function closeSearch(){ $("qres").hidden = true; }

  /* ============================================================
     RENDER AND WIRING
     ============================================================ */
  function render(){
    hideTip(); renderNav();
    var h;
    if (S.page === "matter") h = matterPage();
    else if (S.role === "fee") h = S.page === "matters" ? mattersPage() : S.page === "promises" ? promisesPage() : todayPage();
    else if (S.role === "colp") h = colpView();
    else h = pmView();
    $("main").innerHTML = h;
    if (S.role === "colp" && S.page === "supervision") renderColpScoped();
  }
  function go(page){ S.page = page; render(); window.scrollTo(0, 0); }
  function goMatter(ref){ if (S.page !== "matter") S.from = S.page; S.matter = ref; S.page = "matter"; closeSearch(); $("q").value = ""; render(); window.scrollTo(0, 0); }
  function setRole(r){ S.role = r; S.fe = "all"; S.page = HOME[r]; S.from = HOME[r]; render(); window.scrollTo(0, 0); }
  function setFe(id){ S.fe = id; var sel = $("feSel"); if (sel) sel.value = id; renderColpScoped(); }
  function keep(fn){ var y = window.scrollY; fn(); render(); window.scrollTo(0, y); }

  document.addEventListener("click", function(e){
    var t = e.target;
    if (!t.closest(".search")) closeSearch();
    var g = t.closest("[data-go]"); if (g){ go(g.dataset.go); return; }
    var sr = t.closest("[data-sref]"); if (sr){ goMatter(sr.dataset.sref); return; }
    if (t.closest("[data-back]")){ go(S.from || HOME[S.role]); return; }
    var ex = t.closest("[data-expand]"); if (ex){ keep(function(){ S.open[ex.dataset.expand] = true; }); return; }
    var co = t.closest("[data-collapse]"); if (co){ keep(function(){ S.open[co.dataset.collapse] = false; S.editing[co.dataset.collapse] = false; }); return; }
    var ed = t.closest("[data-edit]"); if (ed){ keep(function(){ S.editing[ed.dataset.edit] = true; });
      var el = $("draft-" + ed.dataset.edit); if (el) el.focus(); return; }
    var pl = t.closest("[data-play]"); if (pl){ keep(function(){ S.played[pl.dataset.play] = true; }); return; }
    var ap = t.closest("[data-approve]");
    if (ap){
      var id = ap.dataset.approve, q = QUEUE.filter(function(x){ return x.id === id; })[0];
      var dr = $("draft-" + id), edited = dr && DRAFTS[id] && dr.textContent.trim() !== DRAFTS[id].text.trim();
      if (dr && edited) S.edits[id] = dr.textContent;
      q.done = true;
      q.doneMsg = q.kind === "summary" ? (edited ? "Approved with your edits · Oliver can now see it" : "Approved · Oliver can now see it")
                : q.kind === "overdue" ? "Done · recorded on the file" : (edited ? "Approved with your edits · on the file" : "Approved · on the file");
      if (q.kind === "overdue") PROMISES.you = PROMISES.you.filter(function(p){ return p[3] !== "late"; });
      keep(function(){}); return;
    }
    var nf = t.closest("[data-newf]"); if (nf){ keep(function(){ S.newFilter = nf.dataset.newf; }); return; }
    var ti = t.closest("[data-today]"); if (ti){ var item = TODAY.filter(function(x){ return x.id === ti.dataset.today; })[0];
      if (item) item.unread = false; goMatter(ti.dataset.ref); return; }
    var mf = t.closest("[data-mf]"); if (mf){ keep(function(){ S.mFilter = mf.dataset.mf; }); return; }
    var pd = t.closest("[data-pdone]"); if (pd){ keep(function(){ S.prom[pd.dataset.pdone] = "done"; }); return; }
    var pdr = t.closest("[data-pdraft]"); if (pdr){ keep(function(){ S.prom[pdr.dataset.pdraft] = "draft"; }); return; }
    var ps = t.closest("[data-psend]"); if (ps){ keep(function(){ S.prom[ps.dataset.psend] = "sent"; }); return; }
    var pc = t.closest("[data-pcancel]"); if (pc){ keep(function(){ delete S.prom[pc.dataset.pcancel]; }); return; }
    var bd = t.closest("[data-bundle]"); if (bd){ keep(function(){ S.bundles[bd.dataset.bundle] = true; }); return; }
    var hd = t.closest("[data-hold]"); if (hd){ keep(function(){ S.holdConfirm = hd.dataset.hold; }); return; }
    var hy = t.closest("[data-hold-yes]"); if (hy){ keep(function(){ S.holds.push(hy.dataset.holdYes); S.holdConfirm = null; }); return; }
    if (t.closest("[data-hold-no]")){ keep(function(){ S.holdConfirm = null; }); return; }
    var ha = t.closest("[data-hold-ask]"); if (ha){ keep(function(){ S.holdAsked[ha.dataset.holdAsk] = true; }); return; }
    var om = t.closest("[data-open-m]"); if (om){ goMatter(om.dataset.openM); return; }
    var rg = t.closest("[data-range]"); if (rg){ S.range = +rg.dataset.range;
      Array.prototype.forEach.call(document.querySelectorAll("[data-range]"), function(b){ b.setAttribute("aria-pressed", String(+b.dataset.range === S.range)); });
      renderColpScoped(); return; }
    var fr = t.closest("tr[data-fe-row]"); if (fr){ setFe(S.fe === fr.dataset.feRow ? "all" : fr.dataset.feRow); return; }
    var fb = t.closest("[data-fe]"); if (fb){ setFe(fb.dataset.fe); var sc = $(fb.dataset.scroll); if (sc) sc.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
    var vb = t.closest("[data-table]"); if (vb){ var k = vb.dataset.table; TABLE[k] = !TABLE[k];
      vb.setAttribute("aria-pressed", String(TABLE[k])); vb.textContent = TABLE[k] ? "Chart" : "Table";
      if (k === "covChart") drawCoverage(); else drawCapture(); return; }
  });
  document.addEventListener("keydown", function(e){
    if (e.target.id === "q"){
      if (e.key === "Enter"){ var hits = runSearch(e.target.value); if (hits.length) goMatter(hits[0].ref); e.preventDefault(); }
      if (e.key === "Escape"){ e.target.value = ""; closeSearch(); e.target.blur(); }
      return;
    }
    if (e.key === "/" && !/input|textarea|select/i.test(e.target.tagName) && !e.target.isContentEditable && S.role !== "pm"){ e.preventDefault(); $("q").focus(); return; }
    if (e.key !== "Enter" && e.key !== " ") return;
    var row = e.target.closest && e.target.closest("tr[data-fe-row]");
    if (row){ e.preventDefault(); row.click(); }
  });
  document.addEventListener("input", function(e){ if (e.target.id === "q") runSearch(e.target.value); });
  document.addEventListener("change", function(e){
    var id = e.target.id;
    if (id === "roleSel" || id === "roleSelM") setRole(e.target.value);
    if (id === "feSel") setFe(e.target.value);
    if (id === "mSort"){ keep(function(){ S.mSort = e.target.value; }); }
    if (id === "ret"){
      var v = e.target.value;
      S.retentionPending = v === S.retention ? null : v;
      $("retNote").innerHTML = S.retentionPending ? pendingNote() : "";
    }
  });
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){
    if (S.role === "colp" && S.page === "supervision"){ drawCoverage(); drawCapture(); Array.prototype.forEach.call(document.querySelectorAll("[data-spark]"), drawSpark); } }, 120); });

  render();
})();
</script>

</body></html>
